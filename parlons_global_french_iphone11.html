<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlons: French for Kreyòl speakers</title>
<meta name="theme-color" content="#17224D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parlons">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17224D;--ink2:#2B3A78;--paper:#F2F5F3;--card:#fff;--saffron:#F0AC1B;--palm:#17795A;--clay:#C4432B;--line:#D3DAD6;--mute:#56627F;--soft:#E8EEF0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;line-height:1.15;margin:0 0 .5em;font-weight:700}
h1{font-size:1.5rem}h2{font-size:1.4rem}h3{font-size:1.1rem}h4{font-size:1rem}
p{margin:.4em 0 .8em}
a{color:var(--ink2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
#app{min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--ink);color:#fff;padding:14px 18px 22px;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--saffron) 0 14px,var(--ink) 14px 20px,var(--palm) 20px 34px,var(--ink) 34px 40px)}
.top h1{margin:0;font-size:1.35rem}
.top small{color:#C9D1F0;display:block}
main{flex:1;padding:16px 16px 96px;max-width:860px;width:100%;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border:0;padding:14px 0;font-size:.74rem;font-weight:600;color:var(--mute);cursor:pointer;border-top:3px solid transparent}
nav button[aria-current=page]{color:var(--ink);border-top-color:var(--saffron)}
@media(min-width:900px){
 #app{display:grid;grid-template-columns:170px 1fr;grid-template-rows:auto 1fr}
 .top{grid-column:1/3}
 nav{position:static;grid-column:1;grid-row:2;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 0;gap:2px}
 nav button{text-align:left;padding:12px 20px;border-top:0;border-left:4px solid transparent;font-size:1rem}
 nav button[aria-current=page]{border-left-color:var(--saffron)}
 main{grid-column:2;grid-row:2;padding-bottom:40px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.card.flat{background:var(--soft);border-color:transparent}
.card.lead{border-left:6px solid var(--saffron)}
.muted{color:var(--mute)}.small{font-size:.88rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.alt{background:transparent;color:var(--ink)}
.btn.good{background:var(--palm);border-color:var(--palm)}
.btn.bad{background:var(--clay);border-color:var(--clay)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.spk{background:var(--saffron);border:0;border-radius:50%;width:38px;height:38px;flex:none;cursor:pointer;font-size:1rem;color:var(--ink)}
.spk::before{content:"\25B6"}
.sp2{display:flex;gap:6px;flex:none}
.spk.slow{background:var(--soft);font-weight:700;font-size:.85rem}
.spk.slow::before{content:"\00BD"}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.done{border-color:var(--palm)}
.big{font:700 2.6rem/1.1 'Bricolage Grotesque',Figtree,sans-serif;margin:.1em 0}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--palm)}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task input{width:24px;height:24px;margin-top:2px;accent-color:var(--palm)}
.kr{display:inline-block;background:#FFF3D1;border-radius:6px;padding:1px 8px;font-size:.9rem}
.ex{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border:0}
ul.tight{padding-left:1.2em;margin:.3em 0}ul.tight li{margin:.3em 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:1rem}
.fb{padding:10px 12px;border-radius:10px;margin:10px 0}
.fb.ok{background:#DDF1E8}.fb.no{background:#F9E0DA}.fb.mid{background:#FFF0C9}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer}
.opt.ok{background:#DDF1E8;border-color:var(--palm)}.opt.no{background:#F9E0DA;border-color:var(--clay)}
details{margin:8px 0}summary{cursor:pointer;font-weight:600;padding:6px 0}
.line{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.who{font-weight:600;min-width:64px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
#toast.on{opacity:1}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
label.ck input{width:22px;height:22px;accent-color:var(--palm);flex:none}
.recdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--clay);margin-right:6px}
@media(prefers-reduced-motion:no-preference){.recdot.on{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}}

/* iPhone 11 and small-screen usability enhancements */
html,body{max-width:100%;overflow-x:hidden}
#app,main,.card{min-width:0}
.card,table,pre{overflow-wrap:anywhere}
.card{overflow-x:auto}
button,select,input,textarea{touch-action:manipulation}
nav button{min-height:54px}
@media(max-width:899px){
 .top{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 20px}
 main{padding:14px 12px calc(100px + env(safe-area-inset-bottom,0px))}
 nav{display:flex;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;justify-content:space-between}
 nav::-webkit-scrollbar{display:none}
 nav button{flex:1 0 auto;min-width:calc(100% / 7);padding:12px 5px;font-size:clamp(.65rem,2.6vw,.78rem);white-space:nowrap}
 .card{padding:14px 12px}
 .big{font-size:clamp(1.8rem,8vw,2.6rem)}
 .row{gap:8px}
 .rate{grid-template-columns:repeat(2,minmax(0,1fr))}
 .spk{width:44px;height:44px}
 .btn.sm{min-height:44px}
 table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
 input[type=text],input[type=number],input[type=date],select,textarea{font-size:16px}
 audio{max-width:100%}
}
@media(max-width:375px){nav button{min-width:63px;font-size:.7rem}nav{justify-content:flex-start}}

.global-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.global-french table{width:100%;min-width:460px;border-collapse:collapse}.global-french th,.global-french td{text-align:left;vertical-align:top;padding:9px;border-bottom:1px solid var(--line);font-size:.9rem}.global-french td:first-child{min-width:135px}.global-french td:nth-child(2){min-width:180px}.global-french .row{flex-wrap:nowrap;align-items:center}.global-french .row button{flex-shrink:0}
</style>
</head>

/* ------------------------- DATA: LESSONS ---------------------------- */
const LESSONS=[
{t:"Sounds and survival",goal:"Read French aloud accurately, introduce yourself, use être.",
 bridge:"Kreyòl already gives you nasal vowels (an, on, en) and the oi sound (moi, toi). New for you: u, eu, the French r, silent final letters, liaison. Kreyòl « mwen se… » becomes « je suis… ».",
 points:["Spelling to sound is regular once you know the rules. Most final consonants are silent (petit, grand, ils parlent).","tu = friend or peer; vous = elder, stranger, shop, or plural. Use vous generously with elders.","être: je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.","In speech, make a question by raising your voice: Tu es haïtien ? Ça va ?","Spend 5 minutes a day in Library > Sounds for the first three weeks."],
 ex:[["Je suis haïtien.","I am Haitian (m)."],["Tu es de quelle ville ?","Which city are you from?"],["Nous sommes amis.","We are friends."],["Elle est ivoirienne.","She is Ivorian."],["Vous êtes professeur ?","Are you a teacher?"]],
 listen:"RFI Journal en français facile (first 5 minutes, twice). Watch 10 minutes of a series with French subtitles on.",
 check:"You can say who you are, where you're from, and ask the same, without reading."},
{t:"Gender, articles and avoir",goal:"Use le/la/un/une correctly, describe people, count to 100, use avoir.",
 bridge:"Kreyòl puts the article after the noun (liv la). French puts it before (le livre). Many Kreyòl nouns froze a French article inside: lekòl (l'école), lajan (l'argent), dlo (de l'eau), diri (du riz). Use these as memory hooks.",
 points:["Every noun is masculine or feminine. Always learn the article with the noun.","le/la/l'/les = the. un/une/des = a, some.","Adjectives agree: grand/grande, petit/petite. The feminine makes the final consonant audible.","avoir: j'ai, tu as, il a, nous avons, vous avez, ils ont. Il y a = there is/are (Kreyòl gen).","Tendencies: -tion, -té, -ure, -ette = feminine. -age, -ment, -eau = masculine.","Numbers 0 to 100."],
 ex:[["J'ai deux frères et une sœur.","I have two brothers and a sister."],["La femme est grande.","The woman is tall."],["Il y a un problème.","There is a problem."],["C'est une belle maison.","It's a beautiful house."],["Elle a trente ans.","She is thirty."]],
 listen:"RFI JEF again. Pick one story and listen three times: gist, details, transcript.",
 check:"You can describe your family and a friend in 6 or more sentences."},
{t:"-er verbs, food and the market",goal:"Conjugate regular -er verbs, ask for food, handle prices.",
 bridge:"Kreyòl verbs never change: mwen manje, li manje, nou manje. French adds endings, but in speech je/tu/il/ils sound the same, so you only have to hear and say nous/vous differently.",
 points:["-er endings: e, es, e, ons, ez, ent.","Partitive (some): du, de la, de l', des. After a negative: pas de. Je ne mange pas de viande.","Polite request: Je voudrais… / Je prends… / Vous avez… ?","Numbers 20 to 100: vingt, trente, quarante, cinquante, soixante, soixante-dix, quatre-vingts, quatre-vingt-dix.","Bargaining: Vous pouvez faire un prix ?"],
 ex:[["Je mange du riz.","I eat (some) rice."],["Nous achetons du poisson.","We buy fish."],["Je voudrais de l'eau, s'il vous plaît.","I'd like some water, please."],["Je ne mange pas de viande.","I don't eat meat."],["C'est un peu cher.","It's a bit expensive."]],
 listen:"Look for market and cooking videos from Abidjan, Dakar or Port-au-Prince with French subtitles.",
 check:"You can complete a market purchase in French, including a price negotiation."},
{t:"Going places: aller, questions, directions",goal:"Use aller, the near future, question words, and prepositions.",
 bridge:"Kreyòl « m pral manje » is French « je vais manger » (aller + infinitive). Kreyòl « pa » before the verb becomes « ne…pas » around it, but in speech the ne often drops: je sais pas.",
 points:["aller: je vais, tu vas, il va, nous allons, vous allez, ils vont.","Futur proche: aller + infinitive. Je vais partir demain.","Also venir (je viens) and prendre (je prends).","Questions: Tu habites où ? / Où est-ce que tu habites ? / Où habites-tu ? (formal)","à + le = au, à + les = aux, de + le = du, de + les = des.","Directions: tout droit, à gauche, à droite, près de, loin de."],
 ex:[["Je vais au marché.","I'm going to the market."],["Nous allons manger à la maison.","We're going to eat at home."],["Où est la gare, s'il vous plaît ?","Where is the station, please?"],["Tu prends le bus ?","Are you taking the bus?"],["Je ne sais pas.","I don't know."]],
 listen:"Start two tutor sessions a week (30 min, topic: your day, your city, directions).",
 check:"You can ask and follow directions and say what you're going to do this weekend."},
{t:"The past: passé composé",goal:"Talk about what happened, with avoir and être.",
 bridge:"Kreyòl « mwen te manje » = « j'ai mangé ». « Li te ale » = « il est allé ». Careful: Kreyòl « te » also covers habits and backgrounds in the past. French splits that job (passé composé vs imparfait, next lesson set).",
 points:["Passé composé = avoir (or être) + past participle.","Participles: -er → é, -ir → i, -re → u. Irregular: fait, pris, eu, été, vu, dit, bu.","être verbs: aller, venir, arriver, partir, rester, naître, mourir, and reflexives. The participle agrees: elle est allée.","Negative wraps the auxiliary: Je n'ai pas mangé.","Time words: hier, ce matin, la semaine dernière, il y a deux jours."],
 ex:[["Hier, j'ai mangé du poisson.","Yesterday I ate fish."],["Elle est arrivée à midi.","She arrived at noon."],["Nous sommes allés au marché.","We went to the market."],["Tu as vu ce film ?","Did you see that film?"],["Je n'ai pas fini.","I haven't finished."]],
 listen:"Podcast: InnerFrench (France, intermediate) once a week; use the transcript.",
 check:"You can narrate yesterday in 8 or more sentences."},
{t:"Modals, reflexives and politeness",goal:"Express wants, abilities, duties; use reflexive verbs.",
 bridge:"Kreyòl vle / kapab / dwe map to vouloir / pouvoir / devoir. Careful: Kreyòl « konnen » covers two French verbs: savoir (facts, skills) and connaître (people, places).",
 points:["Modal + infinitive: Je veux partir. Tu peux venir ? Il doit travailler.","vouloir: veux, veux, veut, voulons, voulez, veulent. pouvoir: peux, peux, peut, pouvons, pouvez, peuvent.","savoir: Je sais nager. connaître: Je connais Marie.","Reflexive verbs: je me lève, tu te lèves, il se lève, nous nous levons.","Il faut + infinitive = one must. Il faut manger."],
 ex:[["Je veux apprendre le français.","I want to learn French."],["Tu peux venir demain ?","Can you come tomorrow?"],["Je sais cuisiner.","I know how to cook."],["Je connais ta sœur.","I know your sister."],["Je me lève à six heures.","I get up at six."]],
 listen:"Watch one episode of a West African series (e.g. Maîtresse d'un homme marié) with French subtitles.",
 check:"You can invite someone, accept or decline politely, and explain why."},
{t:"Body, health, comparisons and possessives",goal:"Describe how you feel, compare, say whose things are whose.",

 ex:[["J'ai mal à la tête.","I have a headache."],["Ma mère est plus âgée que mon père.","My mother is older than my father."],["Il a peur de l'avion.","He's afraid of planes."],["Je suis fatigué depuis lundi.","I've been tired since Monday."],["Nous avons besoin d'aide.","We need help."]],
 listen:"Listen to health or weather segments on RFI Afrique or TV5MONDE Afrique.",

{t:"Storytelling: imparfait and connectors",goal:"Tell stories with background and events.",
 bridge:"Kreyòl « m te konn jwe » = « je jouais » (habit). « M t ap manje » = « je mangeais » (in progress). French: imparfait for scene, habit, description; passé composé for events: « Je mangeais quand il est arrivé. »",
 points:["Imparfait: take the nous form of the present, drop -ons, add -ais, -ais, -ait, -ions, -iez, -aient.","être is irregular: étais, étais, était, étions, étiez, étaient.","Use imparfait for: habits (tous les jours), descriptions, what was going on.","Connectors: d'abord, ensuite, puis, alors, mais, pourtant, enfin, parce que, donc."],

{k:"ou",sp:"ou",ex:["vous","tout","rouge","pour"],tip:"Same as Kreyòl « ou ». Easy win. Contrast it with u: tu / tout."},
{k:"eu",sp:"eu, œu",ex:["peu","deux","sœur","heure"],tip:"Say « é » (or « è ») with rounded lips. Not « ou », not « o »."},
{k:"an / en",sp:"an, en, am, em",ex:["dans","enfant","vent","lentement"],tip:"Nasal vowel, like Kreyòl « an ». Don't pronounce the n."},
{k:"on",sp:"on, om",ex:["bon","mon","nom","maison"],tip:"Nasal, like Kreyòl « on ». Lips rounded, no n."},
{k:"in / ain",sp:"in, ain, ein, un",ex:["vin","pain","chien","demain"],tip:"Nasal, like Kreyòl « en » in « ven ». No n."},
{k:"oi",sp:"oi",ex:["moi","toi","voiture","trois"],tip:"« wa », as in Kreyòl « mwa »."},
{k:"é / è",sp:"é, è, ê",ex:["été","père","mère","fête"],tip:"Kreyòl has both. é = closed (été). è = open (père)."},
{k:"r",sp:"r",ex:["rue","merci","rouge","fort"],tip:"Standard French r is made at the back of the throat. West African and some Haitian speakers use a rolled or tapped r. Everyone understands both; copy your tutor."},
{k:"ch / j / gn",sp:"ch, j/ge, gn",ex:["chat","je","manger","montagne"],tip:"ch = « sh », j = « zh » (like the s in measure), gn = « ny » as in canyon."},

{k:"rhythm",sp:"stress",ex:["Je voudrais un café","Elle habite à Abidjan"],tip:"French has no word stress. Syllables are even and the last syllable of a phrase is lengthened. Don't stress inside words."}

/* ------------------------- STATE & STORAGE -------------------------- */
const KEYS=["set","cards","daily","newToday","cando","log","score","lab","read"];
const HAS_WS=(()=>{try{return !!(window.storage&&typeof window.storage.get==="function")}catch(e){return false}})();
// Inside Claude: window.storage (persists across sessions). Elsewhere: localStorage.
const store={
 cache:{},
 async init(){
  for(const k of KEYS){
   try{
    if(HAS_WS){const r=await window.storage.get("parlons:"+k,false);if(r&&r.value!=null)this.cache[k]=JSON.parse(r.value)}
    else{const v=localStorage.getItem("parlons:"+k);if(v!==null)this.cache[k]=JSON.parse(v)}
   }catch(e){}
  }
 },
 get(k,d){return k in this.cache?this.cache[k]:d},
 set(k,v){
  this.cache[k]=v;
  try{
   if(HAS_WS)window.storage.set("parlons:"+k,JSON.stringify(v),false).then(r=>{if(!r)toast("Couldn't save progress")}).catch(()=>toast("Couldn't save progress"));
   else localStorage.setItem("parlons:"+k,JSON.stringify(v));
  }catch(e){}
 },
 async clear(){
  for(const k of KEYS){try{if(HAS_WS)await window.storage.delete("parlons:"+k,false);else localStorage.removeItem("parlons:"+k)}catch(e){}}
  if(HAS_WS){try{const l=await window.storage.list("parlons:clip:",false);for(const k of(l&&l.keys)||[])await window.storage.delete(k,false)}catch(e){}}
 }
};

function voices(){try{return speechSynthesis.getVoices().filter(v=>/^fr([-_]|$)/i.test(v.lang)&&!/[-_]CA/i.test(v.lang))}catch(e){return[]}}
function speak(text,who=0,cb,rate){
 if(!("speechSynthesis" in window)){toast("Audio is not supported in this browser.");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";
 const vs=voices();let v=vs.find(x=>x.name===S.set.voice);
 if(!v&&vs.length)v=vs[who%vs.length];
 if(v&&who===1&&vs.length>1&&S.set.voice)v=vs.find(x=>x.name!==S.set.voice)||v;
 if(v)u.voice=v;u.rate=rate||S.set.rate;
 if(cb){u.onend=cb;u.onerror=cb}
 speechSynthesis.speak(u);
}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{if(S.tab==="today")render()};
let playToken=0;
function playAll(i){const t=++playToken,L=DIALOGUES[i].lines;let k=0;const next=()=>{if(t!==playToken||k>=L.length)return;speak(L[k][1],L[k][0],()=>{k++;setTimeout(next,350)})};next()}

let SESS=null,speakNext=null;
function buildQueue(){
 const t=dayNum(today()),wk=currentWeek(),due=[],news=[];
 for(const c of ALL){const st=S.cards[c.id];if(st){if(st.due<=t)due.push(c)}else if(S.set.unlockAll||c.w<=wk)news.push(c)}
 if(S.newToday.date!==today()){S.newToday={date:today(),n:0};save("newToday")}
 const left=Math.max(0,S.set.perDay-S.newToday.n);
 return{due:shuffle(due),news:news.slice(0,left)};
}
function startSession(){
 const{due,news}=buildQueue();
 SESS={queue:[...due.map(c=>({c,isNew:false})),...news.map(c=>({c,isNew:true}))],shown:false,total:due.length+news.length,done:0};
 if(SESS.queue.length&&SESS.queue[0].isNew)speakNext=SESS.queue[0].c.fr;
 render();
}
function rateCard(q){
 const it=SESS.queue[0],t=dayNum(today());let st=S.cards[it.c.id];
 if(it.isNew){
  S.cards[it.c.id]={reps:1,ef:2.5,int:1,due:t+1,lapses:0};
  S.newToday.n++;save("newToday");SESS.queue.shift();SESS.done++;
 }else{
  st=st||{reps:0,ef:2.5,int:0,due:t,lapses:0};
  if(q===0){st.lapses++;st.reps=0;st.int=0;st.ef=Math.max(1.3,st.ef-0.2);st.due=t;SESS.queue.shift();SESS.queue.splice(Math.min(3,SESS.queue.length),0,{c:it.c,isNew:false})}
  else{
   if(st.reps===0)st.int=q===3?3:1;
   else if(st.reps===1)st.int=q===3?6:(q===1?2:3);
   else{const m=q===1?1.2:(q===3?st.ef*1.3:st.ef);st.int=Math.max(st.int+1,Math.round(st.int*m))}
   st.ef=Math.max(1.3,st.ef+(q===1?-0.15:q===3?0.1:0));st.reps++;st.due=t+st.int;
   SESS.queue.shift();SESS.done++;
  }
  S.cards[it.c.id]=st;
 }
 save("cards");SESS.shown=false;
 const nx=SESS.queue[0];if(nx&&nx.isNew)speakNext=nx.c.fr;
 if(!SESS.queue.length){markDaily("cards",true)}
 render();
}
function markDaily(id,v){const d=today();S.daily[d]=S.daily[d]||{};S.daily[d][id]=v;save("daily")}

const D={dict:{cur:null,fb:null},order:{cur:null,fb:null},conj:{tense:"present",cur:null,fb:null},gender:{cur:null,fb:null},cloze:{cur:null,fb:null},bridge:{cur:null,fb:null},part:{cur:null,fb:null}};
function bump(k,ok){const s=S.score[k]=S.score[k]||{c:0,t:0};s.t++;if(ok)s.c++;save("score")}
function grade(given,answers){
 const g=norm(given);if(!g)return"empty";
 if(answers.some(a=>norm(a)===g))return"ok";
 if(answers.some(a=>plain(a)===plain(g)))return"mid";
 return"no";
}
const nouns=ALL.map(c=>{
 let m=c.fr.match(/^(le|un) (.+)$/);if(m)return{w:m[2],g:"m",full:c.fr};
 m=c.fr.match(/^(la|une) (.+)$/);if(m)return{w:m[2],g:"f",full:c.fr};
 m=c.fr.match(/^l'(.+) \((m|f)\)$/);if(m)return{w:m[1],g:m[2],full:"l'"+m[1]+" ("+m[2]+")"};
 return null}).filter(Boolean);
function genderTip(w){
 if(/(tion|té|ure|ette|ence|ance|ie)$/.test(w))return"Words ending like this are usually feminine.";
 if(/(age|ment|eau|isme|ier)$/.test(w))return"Words ending like this are usually masculine.";
 return"";
}
function newDrill(kind){
 const d=D[kind];d.fb=null;
 if(kind==="conj"){const v=pick(CONJ[d.tense]);d.cur={v,i:Math.floor(Math.random()*6)}}
 if(kind==="gender")d.cur=pick(nouns);
 if(kind==="cloze"){const pool=CLOZE.filter(c=>S.set.unlockAll||c[0]<=currentWeek());d.cur=pick(pool.length?pool:CLOZE)}
 if(kind==="bridge"){const q=pick(BQ);d.cur={q,opts:shuffle([q[1],...q[2]])}}
 if(kind==="part")d.cur=pick(PART);
 if(kind==="dict"){const pool=SENT_ALL.filter(x=>S.set.unlockAll||x.w<=currentWeek());d.cur=pick(pool.length?pool:SENT_ALL);speakNext=d.cur.fr}
 if(kind==="order"){
  const pool=SENT_ALL.filter(x=>(S.set.unlockAll||x.w<=currentWeek())&&!/[«»]/.test(x.fr)&&x.fr.split(" ").length>=3&&x.fr.split(" ").length<=10);
  const x=pick(pool.length?pool:SENT_ALL.filter(y=>!/[«»]/.test(y.fr)));
  const target=x.fr.replace(/[.,!?;:]/g,"").toLowerCase().split(" ").filter(Boolean);
  let p;do{p=shuffle(target.map(t=>({t})))}while(target.length>1&&p.map(o=>o.t).join(" ")===target.join(" "));
  d.cur={fr:x.fr,en:x.en,target,pool:p,picked:[]};
 }
}

async function toggleRec(){
 if(REC.on){recorder&&recorder.stop();return}
 REC.msg="";
 try{
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==='undefined')throw Error('Microphone recording requires Safari over HTTPS.');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recorder=new MediaRecorder(stream);chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
   clearInterval(recTimer);
   const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
   REC.recs.unshift({url:URL.createObjectURL(blob),label:new Date().toLocaleTimeString()+" (week "+currentWeek()+")"});
   stream.getTracks().forEach(t=>t.stop());REC.on=false;render();
  };
  recorder.start();REC.on=true;REC.start=Date.now();render();
  recTimer=setInterval(()=>{const e=$("#rt");if(e){const s=Math.floor((Date.now()-REC.start)/1000);e.textContent="Recording "+Math.floor(s/60)+":"+pad(s%60)}},500);
 }catch(e){REC.msg="Microphone unavailable here. On iPhone, use the app in Safari from an HTTPS address and allow microphone access. The Files preview cannot reliably record.";render()}
}

// Audio files you add stay in this browser only. Nothing is uploaded.
let CLIPS=[];
const idb={
 db:null,
 open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open("parlons",1);r.onupgradeneeded=()=>r.result.createObjectStore("clips",{keyPath:"id"});r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
 async all(){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction("clips").objectStore("clips").getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 async put(c){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction("clips","readwrite").objectStore("clips").put(c);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})},
 async del(id){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction("clips","readwrite").objectStore("clips").delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
};
const clipStore={
 async all(){
  if(HAS_WS){const l=await window.storage.list("parlons:clip:",false);const out=[];
   for(const k of(l&&l.keys)||[]){try{const r=await window.storage.get(k,false);const c=JSON.parse(r.value);out.push(Object.assign(c,{url:c.data}))}catch(e){}}
   return out}
  const all=await idb.all();return all.map(c=>Object.assign({},c,{url:URL.createObjectURL(c.blob)}));
 },
 async put(file,meta){
  const id=Date.now()+"-"+Math.random().toString(36).slice(2,7);
  if(HAS_WS){
   if(file.size>3.4e6)throw new Error("big");
   const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});
   await window.storage.set("parlons:clip:"+id,JSON.stringify(Object.assign({id,data},meta)),false);
  }else await idb.put(Object.assign({id,blob:file},meta));
 },
 async del(id){if(HAS_WS)await window.storage.delete("parlons:clip:"+id,false);else await idb.del(id)}
};

/* ------------------------- ACTIONS ---------------------------------- */
const A={
 tab(a){S.tab=a;window.scrollTo(0,0);render()},
 go(a){const[t,x]=a.split(":");S.tab=t;if(t==="lib"&&x)S.lib=x;if(t==="plan"&&x)S.week=+x;window.scrollTo(0,0);render()},
 task(a,el){markDaily(a,el.checked);render()},
 week(a){S.week=+a;render()},
 speakwk(a){S.speakWeek=+a;S.tab="speak";render()},
 start(){startSession()},
 reveal(){SESS.shown=true;const c=SESS.queue[0].c;if(S.set.mode==="recall")speakNext=c.fr;render()},
 rate(a){rateCard(+a)},
 endsess(){SESS=null;render()},
 dtab(a){S.dTab=a;render()},
 tense(a,el){D.conj.tense=el.value;D.conj.cur=null;render()},
 next(){const k=S.dTab;newDrill(k);render()},
 check(){
  const k=S.dTab,d=D[k];
  if(k==="order"){
   const c=d.cur;if(!c.picked.length)return;
   const ok=c.picked.length===c.target.length&&c.picked.every((p,i)=>p.t===c.target[i]);
   d.fb={ok};bump(k,ok);speak(c.fr);render();return;
  }
  const inp=$(".ans");if(!inp)return;
  let answers,say="",en="",r;
  if(k==="conj"){answers=[d.cur.v.f[d.cur.i]];say=PR[d.cur.i].split(" ")[0]+" "+answers[0]}
  else if(k==="part"){answers=[d.cur[2]];say=(d.cur[1]==="avoir"?"j'ai ":"je suis ")+answers[0]}
  else if(k==="dict"){answers=[d.cur.fr];say=d.cur.fr;en=d.cur.en}
  else{
   answers=d.cur[2];const a0=answers[0];
   say=d.cur[1].replace(/___ ?/,m=>/['’]$/.test(a0)?a0:a0+(m.endsWith(" ")?" ":"")).replace(/\s*\(.*?\)\s*/g," ").replace(/\s+/g," ").trim();
  }
  if(k==="dict"){
   const cm=x=>norm(x).replace(/[.,!?;:«»"“”]/g,"").replace(/\s+/g," ").trim(),g=cm(inp.value);if(!g)return;
   r=g===cm(answers[0])?"ok":(plain(g)===plain(cm(answers[0]))?"mid":"no");
  }else{r=grade(inp.value,answers);if(r==="empty")return}
  d.fb={r,ans:answers[0],say,en};bump(k,r!=="no");speak(say);render();
 },
 opick(a){const d=D.order;if(d.fb)return;const c=d.cur;c.picked.push(c.pool.splice(+a,1)[0]);render()},
 oun(a){const d=D.order;if(d.fb)return;const c=d.cur;c.pool.push(c.picked.splice(+a,1)[0]);render()},
 imtab(a){S.imTab=a;playToken++;render()},
 sentwk(a){S.tab="immerse";S.imTab="sent";S.sentWeek=+a;window.scrollTo(0,0);render()},
 openread(a){S.tab="immerse";S.imTab="read";S.readOpen=+a;window.scrollTo(0,0);render()},
 closeread(){S.readOpen=null;playToken++;render()},
 readall(a){playSeq(READS[+a].lines.map(l=>l[0]))},
 readslow(a){playSeq(READS[+a].lines.map(l=>l[0]),0.6)},
 markread(a,el){S.read[a]=el.checked;save("read");render()},
 mixcfg(a,el){MIX[a]=el.type==="checkbox"?el.checked:(a==="rep"?+el.value:el.value);updateMix()},
 mixstart(){MIX.on=true;MIX.tok++;MIX.n=0;try{speechSynthesis.cancel()}catch(e){}mixNext();render()},
 mixstop(){MIX.on=false;MIX.tok++;try{speechSynthesis.cancel()}catch(e){}updateMix()},
 mixskip(){if(!MIX.on)return;MIX.tok++;try{speechSynthesis.cancel()}catch(e){}mixNext()},
 gpick(a){const d=D.gender,ok=d.cur.g===a;d.fb={ok};bump("gender",ok);speak(d.cur.full.replace(/\s*\((m|f)\)/,""));render()},
 bpick(a){const d=D.bridge,o=d.cur.opts[+a],ok=o===d.cur.q[1];d.fb={ok,pick:o};bump("bridge",ok);render()},
 lib(a){S.lib=a;S.dlg=null;render()},
 opendlg(a){S.tab="lib";S.lib="dialogues";S.dlg=+a;window.scrollTo(0,0);render()},
 closedlg(){S.dlg=null;playToken++;render()},
 playall(a){playAll(+a)},
 hidefr(a,el){S.hideFr=el.checked;render()},
 showen(a,el){S.showEn=el.checked;render()},
 cando(a,el){S.cando[a]=el.checked;save("cando");render()},
 copy(){navigator.clipboard&&navigator.clipboard.writeText(TUTOR_MSG).then(()=>toast("Copied"),()=>toast("Select the text and copy it manually"))},
 rec(){toggleRec()},
 labtab(a){S.labTab=a;render()},
 addlisten(){const g=id=>$("#"+id).value;S.lab.listen.push({d:today(),acc:g("lab-a"),src:g("lab-s").trim(),clar:+g("lab-c"),mus:+g("lab-m"),enj:+g("lab-e"),r:g("lab-r"),u:g("lab-u"),pace:g("lab-p"),n:g("lab-n").trim()});save("lab");markDaily("listen",true);toast("Saved");render()},
 dellisten(a){S.lab.listen.splice(+a,1);save("lab");render()},
 addtrial(){const g=id=>$("#"+id).value;const name=g("lab-tn").trim();if(!name){toast("Add the tutor's name");return}
  S.lab.trials.push({d:today(),name,acc:g("lab-ta"),und:+g("lab-tu"),enj:+g("lab-te"),tea:+g("lab-tt"),dec:g("lab-td"),n:g("lab-tx").trim()});save("lab");toast("Saved");render()},
 deltrial(a){S.lab.trials.splice(+a,1);save("lab");render()},
 async addclip(){
  const f=$("#lab-f").files;if(!f||!f.length){toast("Choose an audio file first");return}
  const title=$("#lab-ct").value.trim(),acc=$("#lab-ca").value,sent=+$("#lab-cs").value;
  try{
   for(const file of f){await clipStore.put(file,{title:title||file.name,acc,sent})}
   await loadClips();toast("Saved on this device");render();
  }catch(e){toast(e.message==="big"?"File too large for in-app storage (about 3 MB max). Trim it first.":"Couldn't save the file in this browser")}
 },
 async delclip(a){try{await clipStore.del(a);await loadClips();render()}catch(e){toast("Couldn't delete")}},
 seq(a){const els=[...document.querySelectorAll('audio[data-grp="'+a+'"]')];let i=0;els.forEach(e=>e.pause());const go=()=>{if(i>=els.length)return;const el=els[i++];el.currentTime=0;el.onended=go;el.play().catch(()=>toast("Tap play once, then try again"))};go()},
 log(){
  const m=+$("#lm").value||0,r=+$("#lr").value,n=$("#ln").value.trim();if(!m)return;
  S.log.push({d:today(),w:S.speakWeek||currentWeek(),m,r,n});save("log");markDaily("speak",true);toast("Saved");render();
 },
 export(){S.expTxt=JSON.stringify({set:S.set,cards:S.cards,daily:S.daily,newToday:S.newToday,cando:S.cando,log:S.log,score:S.score,lab:S.lab,read:S.read});render()},
 downloadprogress(){const o={app:"Parlons",version:1,exportedAt:new Date().toISOString()};KEYS.forEach(k=>{if(S[k]!==undefined)o[k]=S[k]});const blob=new Blob([JSON.stringify(o,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="parlons-progress-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast("Progress file ready — save it to Files")},
 copyexp(){navigator.clipboard&&navigator.clipboard.writeText(S.expTxt).then(()=>toast("Copied"),()=>toast("Select the text and copy it"))},
 import(){
  const t=$("#imp").value.trim();if(!t)return;
  try{const o=JSON.parse(t);KEYS.forEach(k=>{if(o[k]!==undefined){S[k]=o[k];save(k)}});toast("Progress restored");render()}
  catch(e){toast("That isn't valid backup text")}
 },
 reset(){if(!S.rst){S.rst=true;render();return}store.clear().then(()=>location.reload())}
};
document.addEventListener("change",async e=>{if(e.target.id!=="progressfile")return;const f=e.target.files&&e.target.files[0];if(!f)return;try{const raw=await f.text();const o=JSON.parse(raw);if(!o||typeof o!=="object"||!KEYS.some(k=>Object.prototype.hasOwnProperty.call(o,k)))throw Error("invalid");KEYS.forEach(k=>{if(o[k]!==undefined){S[k]=o[k];save(k)}});toast("Progress restored from file");render()}catch(err){toast("Could not read this progress file")}});
document.addEventListener("click",e=>{
 const s=e.target.closest("[data-say]");if(s){speak(s.dataset.say,+s.dataset.who||0,null,s.dataset.slow?0.6:undefined);return}
 const p=e.target.closest("[data-pair]");if(p){const[a,b]=p.dataset.pair.split("|");speak(a,0,()=>setTimeout(()=>speak(b,0),400));return}
 const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.type==="checkbox"||b.tagName==="INPUT")return;
 const f=A[b.dataset.act];if(f)f(b.dataset.arg,b);
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.set){const k=t.dataset.set;let v=t.type==="checkbox"?t.checked:t.value;if(k==="perDay"||k==="rate")v=+v;S.set[k]=v;save("set");render();return}
 if(t.dataset.act&&A[t.dataset.act])A[t.dataset.act](t.dataset.arg,t);
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("ans")){const b=$('[data-act="check"]');if(b)b.click()}});
store.init().then(()=>{
 S.set=Object.assign(S.set,store.get("set",{}));
 ["cards","daily","newToday","cando","log","score","lab","read"].forEach(k=>{S[k]=store.get(k,S[k])});
 if(!("set" in store.cache))save("set");   // lock in your start date on first run
 render();loadClips();
});
</script>
</body>
